<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olist · Dashboard de Análise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== Tokens · Sonic.Link Design System ===== */
:root{
  --page:#000000; --canvas:#0a0a0a; --panel:#0f0f11; --glass:rgba(24,24,27,.9); --glass-nav:rgba(24,24,27,.8);
  --well:rgba(0,0,0,.4); --control:#27272a; --ghost:rgba(255,255,255,.05);
  --primary:#6366F1; --primary-400:#818cf8; --glow:rgba(99,102,241,.4); --glow-strong:rgba(99,102,241,.8);
  --lime:#bef264; --fuchsia:#f0abfc;
  --t-primary:#ffffff; --t-head:#f4f4f5; --t-strong:#d4d4d8; --t-body:#a1a1aa; --t-muted:#71717a; --t-faint:#52525b;
  --hair:rgba(255,255,255,.05); --divider:rgba(255,255,255,.1); --line:#27272a; --line-strong:#3f3f46;
  --ok:#34d399; --ok-dot:#10b981; --warn:#fbbf24; --crit:#fb7185;
  /* série de dados (validada no fundo #18181B: banda L, croma, CVD, contraste) */
  --s1:#818cf8; --s2:#78a91a; --s3:#d65ce8;
  --grid:rgba(255,255,255,.06); --axis:#52525b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--t-body);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
a{color:inherit}
/* fundo: bloom índigo + grade de pontos (DS · Overlays) */
.bg-bloom{position:fixed;top:-300px;left:50%;width:800px;height:800px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,#6366F1 0%,transparent 60%);opacity:.22;filter:blur(120px);pointer-events:none;z-index:0}
.bg-dots{position:fixed;inset:0;background-image:radial-gradient(#ffffff 1px,transparent 1px);background-size:32px 32px;opacity:.06;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:84rem;margin:0 auto;padding:0 24px 64px}

/* ===== Navbar pill ===== */
header.nav{position:sticky;top:16px;z-index:50;margin:16px auto 0;max-width:84rem;padding:0 24px}
.nav-pill{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:8px 8px 8px 20px;border-radius:9999px;
  background:var(--glass-nav);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--hair);box-shadow:0 20px 50px -20px #000}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand svg{color:var(--primary)}
.brand b{font-weight:400;font-size:14px;letter-spacing:-.04em;text-transform:uppercase;color:#fff}
.brand span{font-size:10px;color:var(--t-muted);letter-spacing:.18em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;color:var(--t-muted);font:500 11px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;
  padding:10px 14px;border-radius:9999px;cursor:pointer;white-space:nowrap;transition:color .2s,background .2s}
.tab:hover{color:#fff;background:var(--ghost)}
.tab.on{color:#fff;background:var(--primary);box-shadow:0 0 12px var(--glow)}
.tab:focus-visible,.chip:focus-visible,.gbtn:focus-visible{outline:2px solid var(--primary-400);outline-offset:2px}

/* ===== Hero de seção ===== */
.hero{padding:56px 0 28px;display:flex;flex-direction:column;gap:14px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;width:fit-content;padding:4px 12px;border-radius:9999px;border:1px solid var(--divider);background:var(--ghost);
  font:400 11px 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--t-body);text-transform:uppercase}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--primary);box-shadow:0 0 8px var(--glow-strong);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
h1{margin:0;font-weight:400;font-size:clamp(30px,4.4vw,52px);letter-spacing:-.035em;line-height:1.05;color:#fff;max-width:22ch}
h1 em{font-style:normal;color:var(--primary-400)}
.lead{margin:0;max-width:72ch;font-size:15px;line-height:1.65;font-weight:300;color:var(--t-body)}
.qtag{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;background:#18181b;border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:400 10px 'JetBrains Mono',monospace;color:var(--t-body);letter-spacing:.04em}

/* ===== Grid & cards ===== */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1024px){.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
@media (max-width:620px){.c3{grid-column:span 12}.wrap,header.nav{padding:0 12px}.brand span{display:none}}
.card{padding:1px;border-radius:20px;background:linear-gradient(to bottom,rgba(255,255,255,.1),transparent);box-shadow:0 25px 50px -12px rgba(0,0,0,.8)}
.card.feat{background:linear-gradient(to bottom,rgba(99,102,241,.35),rgba(255,255,255,.05),transparent)}
.card-in{position:relative;height:100%;border-radius:19px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--hair);overflow:hidden;display:flex;flex-direction:column}
.card-hd{padding:14px 18px;border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.01)}
.card-hd .k{font:400 11px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--t-muted)}
.card-hd .k b{color:var(--primary);font-weight:400}
.card-bd{padding:18px;flex:1;display:flex;flex-direction:column;gap:14px}
.card-t{margin:0;color:#fff;font-weight:400;font-size:17px;letter-spacing:-.02em;line-height:1.3}
.card-s{margin:-8px 0 0;font-size:13px;line-height:1.55;color:var(--t-body);font-weight:300}
.gbtn{appearance:none;cursor:pointer;border:1px solid var(--hair);background:var(--ghost);color:var(--t-body);border-radius:6px;padding:4px 8px;font:400 10px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;transition:.2s}
.gbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.gbtn[aria-pressed="true"]{background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.3);color:var(--primary-400)}

/* chips de filtro (DS · Filter chips) */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flabel{font:400 10px 'JetBrains Mono',monospace;letter-spacing:.18em;color:var(--t-faint);text-transform:uppercase;margin-right:2px}
.chip{appearance:none;cursor:pointer;border:0;border-radius:9999px;padding:7px 14px;font:500 12px 'Inter',sans-serif;background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);transition:.2s}
.chip:hover{background:rgba(255,255,255,.18);color:#fff}
.chip.on{background:var(--lime);color:#000}
.sep{width:1px;height:20px;background:var(--divider);margin:0 6px}

/* KPI / stat tile */
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .v{font-size:clamp(26px,2.6vw,34px);font-weight:400;letter-spacing:-.04em;color:#fff;line-height:1}
.kpi .v small{font-size:.5em;color:var(--t-muted);letter-spacing:0;margin-left:4px}
.kpi .d{font-size:12px;line-height:1.5;color:var(--t-body);font-weight:300}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:4px;border:1px solid rgba(99,102,241,.2);background:rgba(99,102,241,.1);font:400 10px 'JetBrains Mono',monospace;color:#fff;letter-spacing:.14em;text-transform:uppercase}
.badge.ok{border-color:rgba(52,211,153,.25);background:rgba(16,185,129,.1);color:var(--ok)}
.badge.crit{border-color:rgba(251,113,133,.3);background:rgba(251,113,133,.1);color:var(--crit)}
.badge.warn{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.1);color:var(--warn)}

/* meters (DS · Meters) */
.meter{display:flex;flex-direction:column;gap:7px}
.meter .row{display:flex;justify-content:space-between;align-items:flex-end;font:400 11px 'JetBrains Mono',monospace;letter-spacing:.06em}
.meter .row span:first-child{color:var(--t-body);text-transform:uppercase}
.meter .row span:last-child{color:#fff}
.meter .tr{height:4px;background:#000;border-radius:9999px;border:1px solid var(--hair);position:relative;overflow:hidden}
.meter .tr i{position:absolute;inset:0 auto 0 0;border-radius:9999px;background:var(--primary);box-shadow:0 0 8px var(--glow-strong)}
.meter .tr i.n{background:#71717a;box-shadow:none}

/* insight */
.insight{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:var(--canvas);border:1px solid var(--line)}
.insight .n{flex:none;width:26px;height:26px;border-radius:50%;background:#000;border:1px solid var(--hair);display:grid;place-items:center;font:400 11px 'JetBrains Mono',monospace;color:var(--primary-400)}
.insight p{margin:0;font-size:13.5px;line-height:1.6;color:var(--t-strong);font-weight:300}
.insight p b{color:#fff;font-weight:500}
.story{border-left:2px solid var(--primary);padding:4px 0 4px 16px;font-size:15px;line-height:1.7;color:var(--t-strong);font-weight:300;margin:0}
.story b{color:#fff;font-weight:500}
.link{appearance:none;cursor:pointer;border:0;background:none;padding:0;color:var(--primary-400);font:400 11px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
.link:hover{color:#fff}

/* charts */
.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:var(--t-muted)}
.chart text.val{fill:var(--t-strong)}
.chart text.lbl{font-family:'Inter',sans-serif;font-size:11.5px;fill:var(--t-body)}
.chart .hit{fill:transparent;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--t-body)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.ln{height:2px;border-radius:2px}
.tt{position:fixed;z-index:100;pointer-events:none;min-width:140px;max-width:260px;padding:10px 12px;border-radius:12px;background:rgba(15,15,17,.96);border:1px solid var(--line-strong);
  box-shadow:0 20px 40px -10px #000;font-size:12px;line-height:1.5;color:var(--t-strong);opacity:0;transition:opacity .12s}
.tt .h{font:400 10px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--t-muted);margin-bottom:4px}
.tt .r{display:flex;justify-content:space-between;gap:14px}
.tt .r b{color:#fff;font-weight:500;font-family:'JetBrains Mono',monospace;font-size:11.5px}
.tt .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* tabela (alternativa acessível) */
.tbl{display:none;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--canvas)}
.tbl.on{display:block}
.tbl table{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{position:sticky;top:0;background:var(--panel);text-align:left;font:400 10px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--t-muted);padding:9px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--hair);color:var(--t-strong)}
.tbl td.num,.tbl th.num{text-align:right;font-family:'JetBrains Mono',monospace}
.tbl tr:hover td{background:rgba(255,255,255,.03)}
.has-tbl.show-tbl .chart,.has-tbl.show-tbl .legend{display:none}

.section{display:none;animation:fade .45s ease}
.section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gap{height:16px}
footer{margin-top:56px;padding-top:24px;border-top:1px solid var(--divider);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:12px;color:var(--t-muted)}
footer .mono{letter-spacing:.14em;text-transform:uppercase;font-size:10px}
.dot-ok{display:inline-flex;align-items:center;gap:8px}
.dot-ok i{width:6px;height:6px;border-radius:50%;background:var(--ok-dot);box-shadow:0 0 8px rgba(16,185,129,.8);animation:pulse 2s infinite}
.mtable{width:100%;border-collapse:collapse;font-size:13px}
.mtable th{font:400 10px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--t-muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.mtable td{padding:10px;border-bottom:1px solid var(--hair);text-align:right;font-family:'JetBrains Mono',monospace;color:var(--t-strong)}
.mtable td:first-child{font-family:'Inter',sans-serif}
.mtable tr.best td{color:#fff;background:rgba(99,102,241,.08)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<main class="wrap" id="app"></main>

<script>
/* ======================================================= utilidades */
const $ = (s, r = document) => r.querySelector(s);
const nf = (v, d = 0) => v == null ? '—' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const brl = (v, d = 0) => 'R$ ' + nf(v, d);
const brlK = v => Math.abs(v) >= 1e6 ? 'R$ ' + nf(v / 1e6, 2) + ' mi' : Math.abs(v) >= 1e3 ? 'R$ ' + nf(v / 1e3, 0) + ' mil' : brl(v);
const kfmt = v => Math.abs(v) >= 1e6 ? nf(v / 1e6, 1) + ' mi' : Math.abs(v) >= 1e3 ? nf(v / 1e3, v >= 1e4 ? 0 : 1) + ' mil' : nf(v);
const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const ym = s => { const [y, m] = s.split('-'); return MES[+m - 1] + '/' + y.slice(2); };
const cat = s => s.replace(/_/g, ' ');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { s1: '#818cf8', s2: '#78a91a', s3: '#d65ce8', prim: '#6366F1', ok: '#34d399', warn: '#fbbf24', crit: '#fb7185', mute: '#52525b', mute2: '#3f3f46' };
// divergente para notas 1→5: fúcsia (ruim) · cinza neutro · índigo (bom)
const NOTA = ['#d65ce8', '#9b5aa6', '#71717a', '#6f73d6', '#818cf8'];
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function niceTicks(max, n = 4) {
  if (max <= 0) return [0, 1];
  const raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
  const step = (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p; const t = [];
  for (let v = 0; v <= max + step * .001; v += step) t.push(+v.toFixed(10));
  if (t[t.length - 1] < max) t.push(+(t[t.length - 1] + step).toFixed(10));
  return t;
}
/* tooltip */
const TT = $('#tt');
function tip(e, head, rows) {
  TT.innerHTML = `<div class="h">${head}</div>` + rows.map(r => `<div class="r"><span>${r[2] ? `<i class="sw" style="background:${r[2]}"></i>` : ''}${r[0]}</span><b>${r[1]}</b></div>`).join('');
  TT.style.opacity = 1; const w = TT.offsetWidth, hh = TT.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + hh > innerHeight - 8) y = e.clientY - hh - 14;
  TT.style.left = x + 'px'; TT.style.top = y + 'px';
}
function untip() { TT.style.opacity = 0; }
/* barra com topo arredondado de 4px ancorada na base */
function barPath(x, y, w, hgt, r = 4, horiz = false) {
  if (hgt <= 0 || w <= 0) return '';
  if (!horiz) { r = Math.min(r, w / 2, hgt); return `M${x},${y + hgt}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + hgt}Z`; }
  r = Math.min(r, hgt / 2, w); return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + hgt - r}Q${x + w},${y + hgt} ${x + w - r},${y + hgt}H${x}Z`;
}
const REG = []; // gráficos registrados para re-render no resize
function mount(node, fn) { REG.push({ node, fn }); fn(node); }
let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => REG.forEach(r => r.node.isConnected && r.node.offsetParent && r.fn(r.node)), 120); });

/* ======================================================= gráficos (SVG puro) */
// colunas verticais
function barV(node, o) {
  node.innerHTML = ''; const W = node.clientWidth || 600, H = o.h || 240, m = { t: 18, r: 8, b: o.rot ? 46 : 26, l: 48 };
  const s = el('svg', { viewBox: `0 0 ${W} ${H}`, height: H }, node); const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = o.max || Math.max(...o.values) * 1.08, ticks = niceTicks(max), top = ticks[ticks.length - 1];
  const yS = v => m.t + ih - v / top * ih;
  ticks.forEach(t => { el('line', { x1: m.l, x2: W - m.r, y1: yS(t), y2: yS(t), stroke: t ? 'rgba(255,255,255,.06)' : '#3f3f46' }, s); el('text', { x: m.l - 8, y: yS(t) + 3, 'text-anchor': 'end' }, s).textContent = (o.yFmt || kfmt)(t); });
  const n = o.values.length, bw = iw / n, gap = Math.max(2, Math.min(bw * .28, 14));
  const autoEv = Math.ceil(n / Math.max(2, Math.floor(iw / (o.rot ? 34 : 58)))); const every = o.allX ? 1 : Math.max(o.every || 1, autoEv);
  o.values.forEach((v, i) => {
    const x = m.l + i * bw + gap / 2, w = bw - gap, y = yS(v), col = o.color ? o.color(i, v) : C.s1;
    const p = el('path', { d: barPath(x, y, w, m.t + ih - y), fill: col, opacity: o.dim && o.dim(i) ? .35 : 1 }, s);
    if (o.label && o.label(i)) { el('text', { x: x + w / 2, y: y - 6, 'text-anchor': 'middle', class: 'val' }, s).textContent = o.label(i); }
    if (i % every === 0 || o.allX) { const t = el('text', { x: x + w / 2, y: H - m.b + 15, 'text-anchor': o.rot ? 'end' : 'middle', transform: o.rot ? `rotate(-40 ${x + w / 2} ${H - m.b + 15})` : '' }, s); t.textContent = o.labels[i]; }
    const hit = el('rect', { x: m.l + i * bw, y: m.t, width: bw, height: ih, class: 'hit' }, s);
    hit.addEventListener('mousemove', e => { p.setAttribute('opacity', .75); tip(e, o.labels[i], o.tip ? o.tip(i) : [['Valor', (o.yFmt || kfmt)(v)]]); });
    hit.addEventListener('mouseleave', () => { p.setAttribute('opacity', o.dim && o.dim(i) ? .35 : 1); untip(); });
  });
  (o.refs || []).forEach(r => { const x = m.l + r.x * bw; el('line', { x1: x, x2: x, y1: m.t - 4, y2: m.t + ih, stroke: r.c, 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }, s);
    const t = el('text', { x: x + 5, y: m.t + 6 + (r.dy || 0), class: 'val', fill: r.c }, s); t.textContent = r.t; t.style.fill = r.c; });
}
// barras horizontais
function barH(node, o) {
  node.innerHTML = ''; const W = node.clientWidth || 600, rh = o.rh || 26, lw = o.lw || Math.min(190, W * .38), n = o.values.length;
  const H = n * rh + 8, s = el('svg', { viewBox: `0 0 ${W} ${H}`, height: H }, node), vw = 74, iw = W - lw - vw - 6;
  const max = o.max || Math.max(...o.values);

  });

    card({ k: 'Itens por faixa de preço', idx: 'D5', cls: 'c6', title: `~${nf(D.d5.faixas_preco[0].pct + D.d5.faixas_preco[1].pct, 0)}% dos itens custam até R$ 100`, sub: 'O marketplace vende principalmente produtos baratos; só ~3% passam de R$ 500.', body: [fp],
      table: { cols: ['Faixa', '% dos itens'], rows: D.d5.faixas_preco.map(x => [x.f, nf(x.pct, 1) + '%']) } }),
    card({ k: 'Fotos × vendas', idx: 'D5', cls: 'c6', title: 'Mais fotos não significam mais vendas', sub: 'Média de itens vendidos por produto, conforme a quantidade de fotos do anúncio.', body: [ft],
      table: { cols: ['Fotos', 'Vendas médias/produto', 'Produtos'], rows: D.d5.fotos.map(x => [x.f, nf(x.media, 2), nf(x.n)]) } })
  ));
  mount(fp, n => barV(n, { h: 240, labels: D.d5.faixas_preco.map(x => x.f), values: D.d5.faixas_preco.map(x => x.pct), allX: true, yFmt: v => nf(v) + '%', label: i => nf(D.d5.faixas_preco[i].pct, 1) + '%' }));
  mount(ft, n => barV(n, { h: 240, labels: D.d5.fotos.map(x => x.f), values: D.d5.fotos.map(x => x.media), allX: true, max: 5, yFmt: v => nf(v, 0), label: i => nf(D.d5.fotos[i].media, 2), color: () => C.mute,
    tip: i => [['Vendas médias', nf(D.d5.fotos[i].media, 2)], ['Produtos', nf(D.d5.fotos[i].n)]] }));
};

/* ---------------- FRETE & MODELO (D6 + D7B) */
SECTIONS.frete = sec => {
  const F6 = D.d6;
  sec.appendChild(hero('Tema · Frete & Modelo · Desafios 6 e 7', 'Tamanho do produto e distância <em>formam o frete</em> — e dá para prever.',
    'Volume = altura × largura × comprimento; peso em kg. Depois, a distância cliente–vendedor (fórmula de Haversine sobre os CEPs) entra num modelo de regressão para prever freight_value.',
    ['volume_cm3 · peso_kg', 'Haversine', 'LinearRegression · RandomForest', 'cross_val_score']));
  sec.appendChild(grid(
    kpi('Frete × peso', nf(F6.corr.m[0][1], 2), 'Correlação de Pearson — a variável do produto que mais explica o frete', '', 'D6', true),
    kpi('Frete × volume', nf(F6.corr.m[0][2], 2), `Peso e volume são muito correlacionados entre si (${nf(F6.corr.m[1][2], 2)})`, '', 'D6'),
    kpi('Erro médio (MAE)', brl(best.mae, 2), `Random Forest no teste · baseline erra ${brl(M.modelos[0].mae, 2)}`, '<span class="badge">Modelo escolhido</span>', 'D7'),
    kpi('R² no teste', nf(best.r2, 3), `Regressão linear: ${nf(lin.r2, 3)} · sem distância: ${nf(M.modelos[1].r2, 3)}`, '', 'D7')
  ));
  sec.appendChild(spacer());
  let dim = 'peso'; const fb = chartDiv('f-fx');
  const dims = { peso: [F6.peso, 'Frete médio por faixa de peso'], volume: [F6.volume, 'Frete médio por quintil de volume'], dist: [M.frete_dist, 'Frete médio por distância cliente–vendedor'] };
  const fDraw = n => { const r = dims[dim][0]; barV(n, { h: 260, labels: r.map(x => x.f), values: r.map(x => x.media), allX: true, yFmt: v => 'R$' + nf(v), label: i => brl(r[i].media, 2), color: i => i === r.length - 1 ? C.prim : C.s1,
    tip: i => [['Frete médio', brl(r[i].media, 2)], ...(r[i].mediana ? [['Frete mediano', brl(r[i].mediana, 2)]] : []), ['Itens', nf(r[i].n)]] }); cF._refreshTable && cF._refreshTable(); $('#f-fx-t').textContent = dims[dim][1]; };
  const cF = card({ k: 'Frete por faixa', idx: 'D6', cls: 'c7', body: [`<h3 class="card-t" id="f-fx-t"></h3>`, `<p class="card-s">Até ~2 kg o frete sobe pouco; a partir de 5 kg dispara. Itens acima de 10 kg pagam ~3,6× mais que os de até 0,5 kg.</p>`,
    chips('Dimensão', [['peso', 'Peso'], ['volume', 'Volume'], ['dist', 'Distância']], dim, v => { dim = v; fDraw(fb); }), fb],
    table: () => ({ cols: ['Faixa', 'Frete médio', 'Itens'], rows: dims[dim][0].map(x => [x.f, brl(x.media, 2), nf(x.n)]) }) });
  const hm = chartDiv('f-heat');
  sec.appendChild(grid(cF, card({ k: 'Matriz de correlação', idx: 'D6', cls: 'c5', title: 'Quem anda junto com o frete', sub: 'Pearson entre frete, peso, volume e preço do item.', body: [hm] })));
  mount(fb, fDraw); mount(hm, n => heat(n, F6.corr));
  sec.appendChild(spacer());
  const sp = chartDiv('f-sp');
  sec.appendChild(grid(card({ k: 'Frete × peso · amostra de 1.500 itens', idx: 'D6', cls: 'c12', title: 'Relação crescente, mas com muita dispersão', sub: 'Para o mesmo peso o frete varia bastante — a distância entre cliente e vendedor explica parte dessa diferença (por isso entra no modelo).', body: [sp] })));
  mount(sp, n => scatter(n, { h: 300, pts: F6.amostra.map(p => [p[0], p[1]]), xMin: 0, xMax: 30, yMin: 0, yMax: 200, xTicks: [0, 5, 10, 15, 20, 25, 30], yTicks: [0, 50, 100, 150, 200], xFmt: v => nf(v) + ' kg', yFmt: v => 'R$' + nf(v), xLabel: 'Peso (kg)', yLabel: 'Frete (R$)', alpha: .35, r: 3 }));
  sec.appendChild(spacer());
  // modelos
  const mt = `<table class="mtable"><thead><tr><th>Modelo</th><th>MAE</th><th>RMSE</th><th>R²</th></tr></thead><tbody>${M.modelos.map(x => `<tr class="${x.n === 'Random Forest' ? 'best' : ''}"><td>${x.n}${x.n === 'Random Forest' ? ' <span class="badge" style="margin-left:6px">escolhido</span>' : ''}</td><td>${brl(x.mae, 2)}</td><td>${brl(x.rmse, 2)}</td><td>${nf(Math.abs(x.r2) < 0.0005 ? 0 : x.r2, 3)}</td></tr>`).join('')}</tbody></table>`;
  const mae = chartDiv('f-mae'), imp = chartDiv('f-imp');
  const ov = M.overfit, cvm = a => a.reduce((s, x) => s + x, 0) / a.length, cvs = a => { const m = cvm(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / a.length); };
  sec.appendChild(grid(
    card({ k: 'Comparação dos modelos · teste', idx: 'D7', cls: 'c7', feat: true, title: 'Random Forest erra ~53% menos que o baseline', sub: `Treino ${nf(M.treino)} · teste ${nf(M.teste)} linhas (80/20, random_state=42). Incluir a distância levou a regressão linear de R² ${nf(M.modelos[1].r2, 2)} para ${nf(lin.r2, 2)}.`,
      body: [`<div style="overflow-x:auto">${mt}</div>`, mae] }),
    card({ k: 'Validação', idx: 'D7', cls: 'c5', body: [
      `<h3 class="card-t">Overfitting e validação cruzada</h3>`,
      meter('Linear · R² treino', ov.lin_tr * 100, nf(ov.lin_tr, 3), true), meter('Linear · R² teste', ov.lin_te * 100, nf(ov.lin_te, 3), true),
      meter('Random Forest · R² treino', ov.rf_tr * 100, nf(ov.rf_tr, 3)), meter('Random Forest · R² teste', ov.rf_te * 100, nf(ov.rf_te, 3)),
      `<p class="card-s" style="margin:0">Linear sem overfitting; Random Forest com leve overfitting, mas ainda bem acima no teste. Validação cruzada (5 divisões, R²): linear <b style="color:#fff">${nf(cvm(M.cv.lin), 3)} ± ${nf(cvs(M.cv.lin), 3)}</b> · RF <b style="color:#fff">${nf(cvm(M.cv.rf), 3)} ± ${nf(cvs(M.cv.rf), 3)}</b> — estável.</p>`,
      `<div class="card-hd" style="padding:10px 0 0;border:0;background:none"><span class="k">Importância das variáveis · RF</span></div>`, imp] })
  ));
  mount(mae, n => barH(n, { labels: M.modelos.map(x => x.n), values: M.modelos.map(x => x.mae), lw: 150, rh: 30, fmt: v => 'MAE ' + brl(v, 2), color: i => M.modelos[i].n === 'Random Forest' ? C.prim : C.mute }));
  const VN = { peso_kg: 'Peso', volume_cm3: 'Volume', price: 'Preço', distancia_km: 'Distância' };
  mount(imp, n => barH(n, { labels: M.importancia.map(x => VN[x.v]), values: M.importancia.map(x => x.i * 100), lw: 80, rh: 28, max: 100, fmt: v => nf(v, 1) + '%', color: i => i === 0 ? C.s1 : C.mute }));
  sec.appendChild(spacer());
  const rp = chartDiv('f-rp'), rs = chartDiv('f-res');
  sec.appendChild(grid(
    card({ k: 'Real × previsto · Random Forest', idx: 'D7', cls: 'c6', title: 'Pontos perto da diagonal = boa previsão', sub: 'Amostra de 1.200 itens do conjunto de teste. A linha tracejada é a previsão perfeita.', body: [rp] }),
    card({ k: 'Distribuição dos erros', idx: 'D7', cls: 'c6', title: 'Erros concentrados perto de zero', sub: 'Resíduo = frete real − previsto (R$). Valores além de ±40 acumulados nas pontas.', body: [rs] })
  ));
  mount(rp, n => scatter(n, { h: 300, pts: M.real_prev, xMin: 0, xMax: 120, yMin: 0, yMax: 120, xTicks: [0, 30, 60, 90, 120], yTicks: [0, 30, 60, 90, 120], xFmt: v => 'R$' + nf(v), yFmt: v => 'R$' + nf(v), xLabel: 'Frete real', yLabel: 'Frete previsto', diag: true, alpha: .35, r: 3 }));
  mount(rs, n => barV(n, { h: 300, labels: M.resid.map((_, i) => (i - 20) * 2 + ''), values: M.resid, every: 5, color: i => i === 19 || i === 20 ? C.prim : C.s1, tip: i => [['Faixa de erro', 'R$ ' + ((i - 20) * 2) + ' a ' + ((i - 19) * 2)], ['Itens', nf(M.resid[i])]] }));
};

/* ---------------- GEOGRAFIA (D7A) */
SECTIONS.geo = sec => {
  const E = D.d7.estados;
  sec.appendChild(hero('Tema · Geografia · Desafio 7', 'Clientes no Sudeste, <em>vendedores ainda mais</em> concentrados em SP.',
    'Clientes (olist_customers) e vendedores (olist_sellers) agrupados por estado e cidade. O mapa usa os prefixos de CEP da olist_geolocation (média das coordenadas por CEP, apenas pontos dentro do Brasil).',
    ['zip_code_prefix → lat/lng', 'nunique de clientes', 'mapa por coordenadas']));
  const sud = ['SP', 'RJ', 'MG'].reduce((s, u) => s + E.find(e => e.uf === u).pcli, 0);
  sec.appendChild(grid(
    kpi('Clientes em SP', nf(SP.pcli, 1) + '<small>%</small>', `${nf(SP.cli)} clientes únicos`, '', '', true),
    kpi('Vendedores em SP', nf(SP.pvend, 1) + '<small>%</small>', '6 em cada 10 vendedores estão em São Paulo'),
    kpi('SP + RJ + MG', nf(sud, 1) + '<small>%</small>', 'dos clientes estão em apenas 3 estados'),
    kpi('Distância mediana', nf(M.dist_mediana) + '<small>km</small>', 'entre cliente e vendedor de cada item')
  ));
  sec.appendChild(spacer());
  let layer = 'ambos'; const mp = chartDiv('g-map');
  const drawMap = n => {
    const pts = layer === 'cli' ? D.d7.pts_cli.map(p => [...p, 0]) : layer === 'vend' ? D.d7.pts_vend.map(p => [...p, 1]) : D.d7.pts_cli.map(p => [...p, 0]).concat(D.d7.pts_vend.map(p => [...p, 1]));
    const W = Math.min(n.clientWidth || 500, 560);
    scatter(n, { h: Math.round(W * 1.0), pts: pts.map(p => [p[0], p[1]]), xMin: -74, xMax: -34, yMin: -34, yMax: 5.5, xTicks: [-70, -60, -50, -40], yTicks: [-30, -20, -10, 0], xFmt: v => nf(v) + '°', yFmt: v => nf(v) + '°',
      xLabel: 'Longitude', yLabel: 'Latitude', r: 2, color: i => pts[i][2] ? C.s2 : C.s1, alpha: layer === 'ambos' ? .4 : .5 });
    n.querySelector('svg').style.maxWidth = W + 'px'; n.querySelector('svg').style.margin = '0 auto';
  };
  const cM = card({ k: 'Mapa · CEPs geolocalizados', idx: 'D7', cls: 'c6', title: 'Litoral Sul/Sudeste concentra o mercado', sub: `Amostra de ${nf(D.d7.pts_cli.length)} clientes e todos os ${nf(D.d7.pts_vend.length)} vendedores com coordenadas.`,
    body: [chips('Camada', [['ambos', 'Ambos'], ['cli', 'Clientes'], ['vend', 'Vendedores']], layer, v => { layer = v; drawMap(mp); }), legend([['Clientes', C.s1], ['Vendedores', C.s2]]), mp] });
  const top = [...E].sort((a, b) => b.cli - a.cli).slice(0, 12), sb = chartDiv('g-uf');
  const cS = card({ k: 'Participação por estado · top 12', idx: 'D7', cls: 'c6', title: 'Vendedores mais concentrados que clientes', sub: '% do total de clientes únicos e do total de vendedores em cada estado.',
    body: [legend([['% dos clientes', C.s1], ['% dos vendedores', C.s2]]), sb], table: { cols: ['UF', 'Clientes', '% cli.', 'Vendedores', '% vend.'], rows: [...E].sort((a, b) => b.cli - a.cli).map(e => [e.uf, nf(e.cli), nf(e.pcli, 1) + '%', nf(e.vend), nf(e.pvend, 1) + '%']) } });
  sec.appendChild(grid(cM, cS));
  mount(mp, drawMap);
  mount(sb, n => barH2(n, { labels: top.map(e => e.uf), a: top.map(e => e.pcli), b: top.map(e => e.pvend), tip: i => [['Clientes', nf(top[i].cli) + ' (' + nf(top[i].pcli, 1) + '%)', C.s1], ['Vendedores', nf(top[i].vend) + ' (' + nf(top[i].pvend, 1) + '%)', C.s2]] }));
  sec.appendChild(spacer());
  let um = 'frete'; const ur = chartDiv('g-rank');
  const UM = { frete: ['Frete médio por item', v => brl(v, 2), 'R$'], entrega: ['Entrega mediana (dias)', v => nf(v, 1) + ' d'], atraso: ['% de pedidos atrasados', v => nf(v, 1) + '%'], nota: ['Nota média', v => nf(v, 2)] };
  const urDraw = n => { const r = E.filter(e => e[um] != null).sort((a, b) => um === 'nota' ? a[um] - b[um] : b[um] - a[um]);
    barH(n, { labels: r.map(e => e.uf), values: r.map(e => e[um]), lw: 40, rh: 22, fmt: UM[um][1], max: um === 'nota' ? 5 : undefined, color: i => r[i].uf === 'SP' ? C.s2 : C.s1,
      tip: i => [['Frete médio', brl(r[i].frete, 2)], ['Entrega mediana', nf(r[i].entrega, 1) + ' dias'], ['% atrasados', nf(r[i].atraso, 1) + '%'], ['Nota média', nf(r[i].nota, 2)], ['Clientes', nf(r[i].cli)]] }); };
  const cities = (arr, col) => `<table class="mtable"><tbody>${arr.map((c, i) => `<tr><td><span class="mono" style="color:var(--t-faint);margin-right:8px">${String(i + 1).padStart(2, '0')}</span>${c.c.replace(/\b\w/g, l => l.toUpperCase())}</td><td style="color:${col}">${nf(c.n)}</td></tr>`).join('')}</tbody></table>`;
  sec.appendChild(grid(
    card({ k: 'Impacto regional', idx: 'D7', cls: 'c7', title: 'Longe de SP: mais frete, mais espera, nota menor', sub: 'Por estado do cliente. SP em verde para referência. Ordenado do pior para o melhor.',
      body: [chips('Métrica', [['frete', 'Frete'], ['entrega', 'Entrega'], ['atraso', 'Atraso'], ['nota', 'Nota']], um, v => { um = v; urDraw(ur); }), ur] }),
    card({ k: 'Top 10 cidades', idx: 'D7', cls: 'c5', body: [`<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><div class="flabel" style="margin-bottom:6px">Clientes</div>${cities(D.d7.cid_cli, C.s1)}</div><div><div class="flabel" style="margin-bottom:6px">Vendedores</div>${cities(D.d7.cid_vend, C.s2)}</div></div>`] })
  ));
  mount(ur, urDraw);
};

/* ======================================================= roteamento */
const app = $('#app'), tabs = $('#tabs'), built = {};
THEMES.forEach(([id, name]) => {
  const b = h(`<button class="tab" role="tab" id="tab-${id}" aria-controls="sec-${id}">${name}</button>`); b.onclick = () => go(id); tabs.appendChild(b);
  app.appendChild(h(`<section class="section" id="sec-${id}" role="tabpanel" aria-labelledby="tab-${id}"></section>`));
});
app.appendChild(h(`<footer><span class="dot-ok"><i></i><span class="mono" style="color:var(--ok)">Dados processados</span></span><span>Fonte: Olist Brazilian E-Commerce (Kaggle) · Desafio final Harve · análise em Python (pandas, scikit-learn)</span></footer>`));
function go(id) {
  THEMES.forEach(([t]) => { const on = t === id; $('#tab-' + t).classList.toggle('on', on); $('#tab-' + t).setAttribute('aria-selected', on); $('#sec-' + t).classList.toggle('on', on); });
  if (!built[id]) { built[id] = 1; SECTIONS[id]($('#sec-' + id)); } else REG.forEach(r => r.node.isConnected && r.node.offsetParent && r.fn(r.node));
  $('#tab-' + id).scrollIntoView({ block: 'nearest', inline: 'center' }); if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); scrollTo({ top: 0, behavior: 'smooth' }); untip();
}
{ const hsh = location.hash.slice(1); go(hsh in SECTIONS ? hsh : 'overview'); }
</script>
</body>
</html>
